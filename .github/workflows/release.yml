name: Publish to crates.io

# Publish-only workflow for crates.io Trusted Publishing (OIDC).
# Deliberate exception to the estate's no-CI policy: this workflow
# never runs on pull requests or branch pushes and is not a build
# or test gate. Primo's local gates validate the tree; this only
# publishes an already-gated release, and the `release`
# environment's required-reviewer rule means a tag push alone
# cannot complete a publish without an in-the-moment approval.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # Required for OIDC token exchange
    steps:
      - uses: actions/checkout@v6
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
